<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ultimate Love 💕 | Romantic Letters & Fireworks</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="A beautiful romantic experience with love letters, fireworks, and daily challenges for that special someone.">
    <meta name="keywords" content="love, romance, letters, fireworks, relationship, romantic, valentine, anniversary">
    <meta name="author" content="Forever Yours">
    <meta property="og:title" content="My Ultimate Love 💕">
    <meta property="og:description" content="A magical romantic experience with personalized letters and interactive fireworks">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://your-domain.vercel.app/og-image.jpg">
    <meta property="og:url" content="https://your-domain.vercel.app">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#ff6b9d">
    
    <!-- Preload Critical Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>💕</text></svg>">
    
    <style>
        :root {
            --primary: #ff6b9d;
            --secondary: #feca57;
            --accent: #ff9ff3;
            --purple: #c471ed;
            --blue: #667eea;
            --bg-dark: #0f0f23;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --gradient-love: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #feca57 75%, #ff6b9d 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #16213e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text y="28" font-size="28">💕</text></svg>'), auto;
        }

        /* Loading Screen - Optimized */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .heart-loader {
            font-size: 3rem;
            animation: heartbeat 1.5s ease-in-out infinite;
            margin-bottom: 20px;
        }

        .loader-text {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: var(--primary);
            opacity: 0;
            animation: fadeIn 1s ease 0.5s forwards;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Enhanced Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .floating-hearts {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            animation: floatUp 15s linear infinite;
            pointer-events: none;
            will-change: transform, opacity;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(720deg);
                opacity: 0;
            }
        }

        .aurora {
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                rgba(102, 126, 234, 0.15) 0%, 
                rgba(118, 75, 162, 0.15) 25%, 
                rgba(240, 147, 251, 0.15) 50%, 
                rgba(254, 202, 87, 0.15) 75%, 
                rgba(255, 107, 157, 0.15) 100%);
            animation: aurora 25s ease-in-out infinite;
            filter: blur(120px);
            will-change: transform;
        }

        @keyframes aurora {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            33% { transform: translate(-30%, -70%) rotate(120deg); }
            66% { transform: translate(-70%, -30%) rotate(240deg); }
        }

        /* Stars */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
            will-change: opacity;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Fireworks Canvas - Optimized */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Click Effects */
        .click-effect {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            animation: clickRipple 0.6s ease-out forwards;
            will-change: transform, opacity;
        }

        @keyframes clickRipple {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 100px;
                height: 100px;
                opacity: 0;
            }
        }

        /* Time-Based Greeting */
        .greeting-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 15px 30px;
            z-index: 100;
            animation: slideDown 0.5s ease-out;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: var(--primary);
            text-align: center;
            will-change: transform;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* Daily Challenge */
        .challenge-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            max-width: 300px;
            z-index: 100;
            animation: slideUp 0.5s ease-out;
            will-change: transform;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .challenge-header {
            font-family: 'Pacifico', cursive;
            color: var(--secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .challenge-content {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .challenge-complete {
            background: var(--gradient-love);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            will-change: transform, box-shadow;
        }

        .challenge-complete:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.4);
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Love Card */
        .love-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 35px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6),
                        inset 0 0 40px rgba(255, 107, 157, 0.12);
            max-width: 800px;
            width: 100%;
            animation: cardFloat 8s ease-in-out infinite;
            transition: transform 0.3s ease;
            will-change: transform;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .love-card:hover {
            transform: translateY(-5px) scale(1.02);
        }

        /* Title */
        .love-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            background: var(--gradient-love);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease infinite;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(255, 107, 157, 0.6);
            will-change: background-position;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            opacity: 0.9;
        }

        /* Letters Section */
        .letters-section {
            margin: 40px 0;
        }

        .letters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .letter-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            will-change: transform, box-shadow;
        }

        .letter-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .letter-card:hover::before {
            opacity: 1;
        }

        .letter-card:hover {
            transform: translateY(-8px) scale(1.05);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(255, 107, 157, 0.3);
            border-color: var(--primary);
        }

        .letter-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(255, 107, 157, 0.5));
        }

        .letter-title {
            font-family: 'Pacifico', cursive;
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 8px;
            text-align: center;
        }

        .letter-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            opacity: 0.8;
        }

        .letter-status {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
        }

        .letter-status.opened {
            background: var(--secondary);
            box-shadow: 0 0 10px var(--secondary);
        }

        /* Letter Modal */
        .letter-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .letter-modal.active {
            display: flex;
            opacity: 1;
        }

        .letter-content {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: modalAppear 0.4s ease;
            will-change: transform;
        }

        @keyframes modalAppear {
            from {
                transform: scale(0.8) translateY(50px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .letter-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            will-change: transform;
        }

        .letter-close:hover {
            background: rgba(255, 107, 157, 0.3);
            transform: rotate(90deg);
        }

        .letter-header {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
        }

        .letter-body {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text-secondary);
            white-space: pre-wrap;
            margin-bottom: 30px;
        }

        .letter-footer {
            text-align: right;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: var(--primary);
            margin-top: 20px;
        }

        /* Message Container */
        .message-container {
            min-height: 100px;
            margin: 30px 0;
            padding: 25px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .love-message {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text-secondary);
            min-height: 60px;
        }

        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: var(--primary);
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Music Player */
        .music-player {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient-love);
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform, box-shadow;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(255, 107, 157, 0.4);
        }

        .song-info {
            text-align: center;
            margin: 20px 0;
        }

        .song-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .song-time {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress {
            height: 100%;
            background: var(--gradient-love);
            border-radius: 4px;
            transition: width 0.1s linear;
            will-change: width;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            padding: 15px 25px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            min-width: 140px;
            will-change: transform, box-shadow;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 107, 157, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 107, 157, 0.3);
            border-color: var(--primary);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        /* Fireworks Button */
        .fireworks-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--gradient-love);
            border: none;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 107, 157, 0.3);
            will-change: transform, box-shadow;
        }

        .fireworks-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 15px 35px rgba(255, 107, 157, 0.5);
        }

        /* Responsive Design - Optimized */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .love-card {
                padding: 30px 25px;
                margin: 10px;
            }

            .love-title {
                font-size: 2.5rem;
            }

            .letters-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }

            .letter-card {
                padding: 20px;
                min-height: 120px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
            }

            .greeting-banner {
                font-size: 1.2rem;
                padding: 10px 20px;
            }

            .challenge-widget {
                bottom: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
            }

            .fireworks-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .letters-grid {
                grid-template-columns: 1fr;
            }

            .love-card {
                padding: 25px 20px;
            }

            .letter-content {
                padding: 30px 20px;
            }

            .greeting-banner {
                font-size: 1rem;
                padding: 8px 16px;
            }
        }

        /* Performance Optimizations */
        .gpu-accelerated {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            :root {
                --card-bg: rgba(0, 0, 0, 0.8);
                --text-primary: #ffffff;
                --text-secondary: #cccccc;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loader" id="loader">
        <div class="heart-loader">💕</div>
        <div class="loader-text">Creating magic for you...</div>
    </div>

    <!-- Fireworks Canvas -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Enhanced Animated Background -->
    <div class="animated-bg">
        <div class="aurora"></div>
        <div class="stars" id="starsContainer"></div>
        <div id="heartsContainer"></div>
    </div>

    <!-- Time-Based Greeting -->
    <div class="greeting-banner" id="greetingBanner">
        <span id="greetingText"></span>
    </div>

    <!-- Daily Challenge Widget -->
    <div class="challenge-widget" id="challengeWidget">
        <div class="challenge-header">
            <i class="fas fa-heart"></i>
            <span>Daily Love Mission</span>
        </div>
        <div class="challenge-content" id="challengeContent"></div>
        <button class="challenge-complete" id="challengeComplete">Complete Mission 💕</button>
    </div>

    <!-- Fireworks Button -->
    <button class="fireworks-btn" id="fireworksBtn" title="Click for fireworks!">
        🎆
    </button>

    <!-- Main Container -->
    <div class="container">
        <div class="love-card gpu-accelerated">
            <h1 class="love-title">My Ultimate Love 💕</h1>
            <p class="subtitle">Every moment magical, every click special</p>
            
            <div class="message-container">
                <div class="love-message" id="loveMessage">
                    <span id="messageText"></span>
                    <span class="typing-cursor" id="cursor"></span>
                </div>
            </div>

            <div class="letters-section">
                <div class="letters-grid" id="lettersGrid">
                    <!-- Letters will be generated by JavaScript -->
                </div>
            </div>

            <div class="controls">
                <button class="btn gpu-accelerated" id="messageBtn">
                    <span>New Message</span>
                </button>
                <button class="btn gpu-accelerated" id="replayBtn">
                    <span>Replay</span>
                </button>
                <button class="btn gpu-accelerated" id="surpriseBtn">

        // Optimized Firework Class
        class Firework {
            constructor(canvas, ctx) {
                this.canvas = canvas;
                this.ctx = ctx;
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * canvas.height * 0.5;
                this.speed = Math.random() * 3 + 2;
                this.particles = [];
                this.exploded = false;
                this.hue = Math.random() * 360;
            }

            update() {
                if (!this.exploded) {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        this.explode();
                    }
                } else {
                    this.particles = this.particles.filter(p => p.alpha > 0);
                    this.particles.forEach(p => p.update());
                }
            }

            explode() {
                this.exploded = true;
                const particleCount = Math.random() * 50 + 50;
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push(new Particle(this.x, this.y, this.hue));
                }
            }

            draw() {
                if (!this.exploded) {
                    this.ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
                    this.ctx.fillRect(this.x, this.y, 2, 2);
                } else {
                    this.particles.forEach(p => p.draw(this.ctx));
                }
            }

            isDead() {
                return this.exploded && this.particles.length === 0;
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.hue = hue + Math.random() * 30 - 15;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
                ctx.fillRect(this.x, this.y, 3, 3);
                ctx.restore();
            }
        }

        function setupFireworks() {
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const fireworks = [];

            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                fireworks.forEach((firework, index) => {
                    firework.update();
                    firework.draw();
                    if (firework.isDead()) {
                        fireworks.splice(index, 1);
                    }
                });

                requestAnimationFrame(animate);
            }

            animate();
            
            window.createFirework = function(x, y) {
                fireworks.push(new Firework(canvas, ctx));
            };
            
            performanceMonitor.log('Fireworks setup complete');
        }

            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                toggleMusic();
            } else if (e.code === 'ArrowRight') {
                nextMessage();
            } else if (e.code === 'ArrowLeft') {
                replayMessage();
            } else if (e.code === 'Escape') {
                closeLetter();
            } else if (e.code === 'KeyF') {
                createFirework();
            }
        });

        // Update timers
        setInterval(updateTimeGreeting, 60000);
        
        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 0 && now.getMinutes() === 0) {
                updateDailyChallenge();
            }
        }, 60000);

        // Service Worker for PWA capabilities (optional)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').then(function(registration) {
                    console.log('SW registered: ', registration);
                }).catch(function(registrationError) {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }

        // Performance optimization - reduce frequency on low-end devices
        let animationFrameId;
        function checkPerformance() {
            const fps = 1000 / (performance.now() - lastFrameTime);
            if (fps < 30) {
                // Reduce animation frequency on low-end devices
                console.log('Low performance detected, reducing animations');
            }
            lastFrameTime = performance.now();
            animationFrameId = requestAnimationFrame(checkPerformance);
        }

        let lastFrameTime = performance.now();
        checkPerformance();
    </script>
</body>
</html>
